[package]
name = "chappie"
version = "0.1.9"
description = "Hands-free voice AI assistant"
authors = ["piro <piro.haniwa@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chappie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.14"
once_cell = "1"
tauri-plugin-store = "2.4.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "system-proxy"] }
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
dirs = "6.0.0"
futures-util = "0.3.32"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
cpal = "0.15"
rubato = { version = "0.16", features = ["fft_resampler"], default-features = false }
voice_activity_detector = "0.2"
chrono = "0.4"
urlencoding = "2"
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[features]
# Enable Metal acceleration on macOS for whisper-rs.
default = ["whisper-rs/metal"]

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

