[package]
name = "chappie"
version = "0.3.0"
description = "Hands-free voice AI assistant"
authors = ["piro <piro.haniwa@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chappie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "test"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16"
once_cell = "1"
uuid = { version = "1", features = ["v4", "v5"] }
tauri-plugin-store = "2.4.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "system-proxy"] }
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time"] }
dirs = "6.0.0"
futures-util = "0.3.32"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
cpal = "0.17"
rubato = { version = "0.16", features = ["fft_resampler"], default-features = false }
voice_activity_detector = "0.2"
# Speaker recognition: WeSpeaker ECAPA-TDNN ONNX via pure-Rust tract +
# kaldi-compatible 80-dim mel filterbank for preprocessing. Model file
# is downloaded on first run (mirroring the Whisper model flow in
# `model.rs`) so the bundled binary stays small.
tract-onnx = "0.22"
kaldi-fbank-rust-kautism = "0.1"
# Text tokenization for the multilingual-e5-small embedding model used
# by rag.rs. HuggingFace's `tokenizers` crate loads a tokenizer.json
# file (BPE / WordPiece / Unigram all supported).
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
chrono = "0.4"
chrono-tz = "0.10"
urlencoding = "2"
url = "2"
arboard = "3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rss = { version = "2.0", default-features = false }
readability = "0.3"

# WebRTC's AudioProcessing module (AEC3 / AGC2 / noise suppression).
# `bundled` builds the C++ library from source via meson/cp, which only
# works on Unix toolchains — the bundled build shells out to `cp` and is
# not MSVC-compatible. So it's scoped to non-Windows targets here; `apm.rs`
# provides a pass-through stub on Windows (see the `#[cfg]` split there).
# Used by `apm.rs`.
[target.'cfg(not(target_os = "windows"))'.dependencies]
webrtc-audio-processing = { version = "2", features = ["bundled"] }

# Windows system integration. Each macOS shell-out (osascript / pmset /
# caffeinate / screencapture / open) has a Win32 equivalent reached through
# this crate: Core Audio (volume), GetSystemPowerStatus (battery),
# SetThreadExecutionState / SetSuspendState (sleep prevention / sleep),
# LockWorkStation (lock), SystemParametersInfo (wallpaper), GDI BitBlt
# (screenshot), and the SMTC WinRT API (media control). See the per-module
# `#[cfg(target_os = "windows")]` impls.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSArray", "NSPredicate", "NSString", "NSError", "NSURL"] }
objc2-event-kit = { version = "0.3.2", features = [
    "EKTypes",
    "EKObject",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
] }
objc2-core-location = { version = "0.3.2", features = [
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
    "CLPlacemark",
    "CLGeocoder",
    "CLError",
    "block2",
] }
block2 = "0.6"
# Metal-accelerated Whisper on macOS. Cargo unions features across target
# sections, so the macOS build still gets `metal` even though the base
# whisper-rs dep above doesn't enable it.
whisper-rs = { version = "0.16", features = ["metal"] }

[features]
default = []

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
# Ship a stripped binary, but split debug info into a local .dSYM so that
# macOS crash reports (.ips) can be symbolicated after the fact with `atos`.
# Without this, stripped release frames are bare addresses and a main-thread
# panic is impossible to pin to a function. The .dSYM stays in target/release/
# and is NOT bundled into the distributed .app.
strip = true
debug = "line-tables-only"
split-debuginfo = "packed"

