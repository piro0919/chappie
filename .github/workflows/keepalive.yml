name: Keep Supabase awake

# Supabase の Free プランは、直近 7 日間のデータベースへのリクエストが少ないと
# プロジェクトを自動で一時停止する。止まるとサインインも課金状態の確認もできなくなるので、
# 1 日 3 回 REST を叩いて活動を作っておく。
# https://supabase.com/docs/guides/platform/free-project-pausing
#
# URL と anon キーは src/lib/supabase-client.ts に書いてあるものと同じ公開値。

on:
  schedule:
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: https://gnxadmwmjelpqvwsfgly.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/quota?select=date&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          test "$status" = "200"
