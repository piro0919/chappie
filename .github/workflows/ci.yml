name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # macOS 専用アプリなので、Linux ランナーでは tauri のシステム依存が揃わない。
  ci:
    runs-on: macos-latest
    # 通った実行は2〜32分だった（2026-11-16 に直近8本を測った）。止まったときに6時間回し続けない。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.11
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # build は tsc を通してから vite を回すので、型検査を兼ねている。
      - run: pnpm build
      - run: pnpm test --run
      - uses: dtolnay/rust-toolchain@stable
      # webrtc-audio-processing-sys の build.rs が meson を呼ぶ。
      - run: brew install meson ninja
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # secrets のテストは本物のキーチェーンに読み書きする。ランナーの既定の
      # キーチェーンのままだと、見えない確認のダイアログで止まり、job が6時間の
      # 上限まで回り続けた（2026-11-16）。鍵を外した専用のキーチェーンを既定にする。
      - name: Use an unlocked keychain for the secrets tests
        run: |
          security create-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
      # whisper.cpp が std::filesystem を使うので、10.15 のままだとビルドが通らない。
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
