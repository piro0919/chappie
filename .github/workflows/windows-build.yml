name: windows-build

# Compile-gate for the Windows port (#22). The backend is cfg-gated per
# target_os, so a macOS-only change can silently break the Windows build
# with nothing on the Mac dev box to catch it. This runs `cargo check` on a
# real windows-latest runner so that breakage surfaces on every push/PR.
#
# It does NOT exercise runtime behaviour (no mic / Whisper / WinRT calls) —
# end-to-end hardware verification still happens manually on Windows 11.

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-build.yml"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    env:
      # whisper-rs-sys runs bindgen, which needs libclang. The windows-latest
      # image ships LLVM here; point bindgen at it explicitly so it never
      # falls back to a PATH probe.
      LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.11

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! embeds frontendDist (../dist) at compile time,
      # so the Rust check fails unless the renderer has been built first.
      - name: Build renderer (produces dist/ for generate_context!)
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ort-sys (copy-dylibs) copies DirectML.dll into <dir>, <dir>/examples and
      # <dir>/deps, and panics with "path not found" when a dir doesn't exist yet.
      # Under `cargo check` <dir> resolves to target/debug/build (the log shows
      # target\debug\build\DirectML.dll). The subdirs only existed when
      # rust-cache restored a warm target/, so every cache miss failed. Create
      # them up front so a cold build behaves like a warm one.
      - name: Pre-create target dirs for ort-sys
        working-directory: src-tauri
        shell: bash
        run: mkdir -p target/debug/build/examples target/debug/build/deps target/debug/examples target/debug/deps

      - name: cargo check (all targets)
        working-directory: src-tauri
        run: cargo check --all-targets --locked
