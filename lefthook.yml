pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: pnpm exec biome check --write {staged_files}
      stage_fixed: true
    secretlint:
      glob: "*"
      run: pnpm exec secretlint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
